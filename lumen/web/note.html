<!doctype html>
<html lang="pt-BR" data-ui="{{UI_STYLE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="lumen-token" content="{{TOKEN}}">
<title>Minha compreensão</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256">
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/app.css">
<script src="/ui.js" defer></script>
<script src="/understanding-editor.js" defer></script>
<script src="/pomodoro.js" defer></script>
<script src="/note.js" defer></script>
</head>
<!-- Janela flutuante de “Minha compreensão”: a mesma nota da janela principal, por cima do vídeo da aula. -->
<body class="note-window">
<header class="nw-bar" id="nw-bar">
  <div class="nw-title"><strong>Minha compreensão</strong><span id="nw-lesson"></span></div>
  <button class="nw-rec" type="button" id="nw-rec" hidden><span class="live-dot" aria-hidden="true"></span><svg class="i" aria-hidden="true"><use href="/icons.svg#pause"/></svg><span id="nw-rec-text"></span></button>
  <span class="pomo-slot" id="nw-pomo"></span>
  <div class="nw-tools">
    <button class="icon-btn" type="button" id="nw-min" aria-label="Minimizar" data-tip="Minimizar"><svg class="i"><use href="/icons.svg#minus"/></svg></button>
    <button class="icon-btn" type="button" id="nw-dock" aria-label="Voltar para o Lumen" data-tip="Voltar para o Lumen"><svg class="i"><use href="/icons.svg#dock"/></svg></button>
    <button class="icon-btn" type="button" id="nw-close" aria-label="Fechar janela flutuante" data-tip="Fechar (a nota continua salva)"><svg class="i"><use href="/icons.svg#x"/></svg></button>
  </div>
</header>
<main class="nw-body">
  <div class="paper nw-paper">
    <textarea id="nw-text" class="writing" aria-label="Minha compreensão" spellcheck="true" autocomplete="off"
              autocapitalize="sentences" maxlength="12000" placeholder="O que você entendeu?"></textarea>
    <div class="u-foot"><span class="u-save" id="nw-save" aria-live="polite"></span><span id="nw-count"></span></div>
  </div>
  <div class="nw-status" id="nw-status" data-tone="wait" role="status" aria-live="polite"><span id="nw-ready"></span><button type="button" class="btn primary sm nw-go" id="nw-go" hidden>Processar</button></div>
  <p class="nw-hint" id="nw-hint" aria-live="polite"></p>
</main>
</body>
</html>
